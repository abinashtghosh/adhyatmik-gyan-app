<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>अध्यात्मिक ज्ञान | Hindu Panchang, Puja & Vrat Calendar</title>
  <style>
    body { font-family: sans-serif; background: #fff8ed; margin: 0; padding: 15px; color: #333; }
    
    /* Top Bar & Hero Section */
    .hero { background: linear-gradient(135deg, #d97706, #92400e); border-radius: 16px; padding: 20px; color: #fff; margin-bottom: 20px; }
    .hero-box { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
    .pill { background: #d97706; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
    
    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #fed7aa; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .icon-box { width: 50px; height: 50px; border-radius: 50%; background: #fef3c7; border: 2px solid #d97706; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 8px auto; }
    .btn { background: #d97706; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 12px; }
    
    /* Chips */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chips button { background: #fff; border: 1px solid #fed7aa; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #92400e; }

    /* Modal Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modalBox { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 420px; position: relative; max-height: 85vh; overflow-y: auto; }
    .close { position: absolute; top: 10px; right: 15px; font-size: 26px; border: none; background: none; cursor: pointer; color: #92400e; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Dynamic Banner -->
  <section class="hero">
    <div class="hero-box">
      <span class="pill" id="heroPill">ॐ • दैनिक पंचांग</span>
      <h2 id="heroTitle" style="margin: 8px 0 4px 0;">आज का दैनिक पंचांग</h2>
      <p id="heroText" style="margin: 0 0 8px 0; font-size: 14px;">शुभ मुहूर्त और दैनिक तिथि के अनुसार पूजन करें।</p>
      <div id="heroMantra" style="font-size: 13px; font-weight: bold; color: #fde68a;"></div>
    </div>
  </section>

  <!-- Today Cards -->
  <h3>आज का दैनिक पंचांग एवं पूजा</h3>
  <div class="grid">
    <div class="card">
      <div class="icon-box">🪔</div>
      <b style="color:#92400e;">Today's Puja</b><br>
      <small id="todayPujaSubText">Loading...</small><br>
      <button class="btn" data-modal="puja">विधि देखें</button>
    </div>

    <div class="card">
      <div class="icon-box">🕉️</div>
      <b style="color:#92400e;">Today's Vrat</b><br>
      <small id="todayVratSubText">Loading...</small><br>
      <button class="btn" data-modal="vrat">नियम देखें</button>
    </div>
  </div>

  <!-- Deity Buttons -->
  <h3>पूजा एवं साधना</h3>
  <div class="chips">
    <button data-modal="ganesh">गणेश</button>
    <button data-modal="lakshmi">लक्ष्मी</button>
    <button data-modal="shiv">शिव</button>
    <button data-modal="hanuman">हनुमान</button>
    <button data-modal="krishna">कृष्ण</button>
    <button data-modal="durga">दुर्गा</button>
    <button data-modal="vishnu">विष्णु</button>
  </div>

  <!-- Popup Modal -->
  <div class="modal" id="modal">
    <div class="modalBox">
      <button class="close" id="closeModal">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Javascript Code Starts Here inside <script> tag -->
  <script>
    const godImages = {
      "surya": "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
      "shiv": "https://images.unsplash.com/photo-1567157577867-05ccb1388e66?auto=format&fit=crop&w=600&q=80",
      "hanuman": "https://images.unsplash.com/photo-1609137144813-7d9921338f24?auto=format&fit=crop&w=600&q=80",
      "ganesh": "https://images.unsplash.com/photo-1567591377030-de198b9d5186?auto=format&fit=crop&w=600&q=80",
      "vishnu": "https://images.unsplash.com/photo-1545232979-fbf592320781?auto=format&fit=crop&w=600&q=80",
      "lakshmi": "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=80",
      "durga": "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=80",
      "krishna": "https://images.unsplash.com/photo-1545232979-fbf592320781?auto=format&fit=crop&w=600&q=80"
    };

    const weeklyPanchangDefaults = {
      0: { god: "surya", puja: "सूर्य देव पूजा एवं अर्घ्य", mantra: "ॐ घृणिः सूर्याय नमः" },
      1: { god: "shiv", puja: "भगवान शिव अभिषेक एवं पूजा", mantra: "ॐ नमः शिवाय" },
      2: { god: "hanuman", puja: "हनुमान चालीसा एवं संकटमोचन पूजा", mantra: "ॐ हं हनुमते नमः" },
      3: { god: "ganesh", puja: "श्री गणेश दूर्वा अर्पण एवं पूजा", mantra: "ॐ गं गणपतये नमः" },
      4: { god: "vishnu", puja: "श्री हरि विष्णु एवं केला पूजन", mantra: "ॐ नमो भगवते वासुदेवाय" },
      5: { god: "lakshmi", puja: "मां लक्ष्मी एवं वैभव पूजा", mantra: "ॐ श्रीं ह्रीं श्रीं कमले कमलालये प्रसीद" },
      6: { god: "shiv", puja: "शनिदेव तेल अर्पण एवं पीपल पूजा", mantra: "ॐ शं शनैश्चराय नमः" }
    };

    const sadhanaData = {
      "ganesh": { title: "श्री गणेश पूजा एवं मंत्र", mantra: "ॐ गं गणपतये नमः", desc: "समस्त विघ्न दूर करने हेतु गणेश साधना करें।", godKey: "ganesh" },
      "lakshmi": { title: "मां लक्ष्मी पूजा एवं मंत्र", mantra: "ॐ श्रीं ह्रीं श्रीं कमले कमलालये प्रसीद", desc: "धन, धान्य और समृद्धि हेतु लक्ष्मी पूजन करें।", godKey: "lakshmi" },
      "shiv": { title: "भगवान शिव पूजा एवं मंत्र", mantra: "ॐ नमः शिवाय", desc: "शिव आराधना से आरोग्यता और शांति मिलती है।", godKey: "shiv" },
      "hanuman": { title: "श्री हनुमान साधना", mantra: "ॐ हं हनुमते नमः", desc: "हनुमान चालीसा पाठ से संकट दूर होते हैं।", godKey: "hanuman" },
      "krishna": { title: "श्री कृष्ण भक्ति", mantra: "हरे कृष्ण हरे कृष्ण, कृष्ण कृष्ण हरे हरे", desc: "भगवान श्रीकृष्ण के ध्यान से आनंद मिलता है।", godKey: "krishna" },
      "durga": { title: "मां दुर्गा साधना", mantra: "ॐ दुं दुर्गायै नमः", desc: "दुर्गा मंत्र से शक्ति और सुरक्षा मिलती है।", godKey: "durga" },
      "vishnu": { title: "भगवान विष्णु पूजा", mantra: "ॐ नमो भगवते वासुदेवाय", desc: "श्री हरि विष्णु की भक्ति से सुख-शांति मिलती है।", godKey: "vishnu" }
    };

    let currentTodayData = {};

    function initPanchang() {
      const today = new Date();
      const dayOfWeek = today.getDay();
      const defaultDay = weeklyPanchangDefaults[dayOfWeek];

      currentTodayData = {
        title: defaultDay.puja,
        tithi: "दैनिक तिथि",
        godKey: defaultDay.god,
        mantra: defaultDay.mantra
      };

      document.getElementById("heroTitle").innerText = defaultDay.puja;
      document.getElementById("heroMantra").innerText = `मंत्र: ${defaultDay.mantra}`;
      document.getElementById("todayPujaSubText").innerText = defaultDay.puja;
      document.getElementById("todayVratSubText").innerText = "नित्य नियम एवं पूजन";
    }

    document.addEventListener("DOMContentLoaded", function() {
      initPanchang();

      const modal = document.getElementById("modal");
      const modalContent = document.getElementById("modalContent");
      const closeModal = document.getElementById("closeModal");

      document.addEventListener("click", function(e) {
        const btn = e.target.closest("[data-modal]");
        if (!btn) return;

        const modalType = btn.getAttribute("data-modal");
        const ytLink = "https://www.youtube.com/@AdhyatmikGyan24x7?sub_confirmation=1";

        if (modalType === "puja" || modalType === "vrat") {
          const godImg = godImages[currentTodayData.godKey] || godImages["vishnu"];

          modalContent.innerHTML = `
            <div style="text-align:center;">
              <img src="${godImg}" alt="Bhagwan Image" style="width:100%; max-height:200px; object-fit:cover; border-radius:10px; margin-bottom:12px; border:2px solid #d97706;">
              <h2 style="color:#92400e; margin-bottom:6px;">🪔 ${currentTodayData.title}</h2>
              <small style="color:#666; font-weight:bold;">${currentTodayData.tithi}</small>
              
              <div style="background:#fff8ed; padding:10px; border-radius:8px; margin:12px 0; border-left:4px solid #d97706; text-align:left;">
                <b>मंत्र:</b>
                <p style="font-size:15px; color:#d97706; margin-top:4px; font-weight:bold;">${currentTodayData.mantra}</p>
              </div>

              <p style="text-align:left; font-size:13px; color:#444;">
                आज के दिन स्नान करके स्वच्छ वस्त्र धारण करें, भगवान का ध्यान करें, दीप-धूप प्रज्वलित करें और भक्ति भाव से पूजा संपन्न करें।
              </p>

              <div style="margin-top:15px;">
                <a href="${ytLink}" target="_blank" class="btn" style="display:inline-block; text-decoration:none; padding:10px 16px;">
                  ▶ YouTube पर विधि देखें
                </a>
              </div>
            </div>
          `;
          modal.classList.add("active");
          return;
        }

        if (sadhanaData[modalType]) {
          const item = sadhanaData[modalType];
          const godImg = godImages[item.godKey] || godImages["vishnu"];

          modalContent.innerHTML = `
            <div style="text-align:center;">
              <img src="${godImg}" alt="Bhagwan Image" style="width:100%; max-height:200px; object-fit:cover; border-radius:10px; margin-bottom:12px; border:2px solid #d97706;">
              <h2 style="color:#92400e;">🕉️ ${item.title}</h2>
              <div style="background:#fff8ed; padding:10px; border-radius:8px; margin:12px 0; border-left:4px solid #d97706; text-align:left;">
                <b>मूल मंत्र:</b>
                <p style="font-size:15px; color:#d97706; margin-top:4px; font-weight:bold;">${item.mantra}</p>
              </div>
              <p style="text-align:left; font-size:13px; color:#444;">${item.desc}</p>
              <div style="margin-top:15px;">
                <a href="${ytLink}" target="_blank" class="btn" style="display:inline-block; text-decoration:none; padding:10px 16px;">
                  ▶ YouTube पर वीडियो देखें
                </a>
              </div>
            </div>
          `;
          modal.classList.add("active");
          return;
        }
      });

      closeModal.addEventListener("click", function() {
        modal.classList.remove("active");
      });
    });
  </script>
</body>
</html>
